<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Contact · Your Name</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- NAVBAR (same on every page). Change "Your Name" to your name. -->
  <header class="site-header">
    <a class="logo" href="index.html">Michelle Cordovi</a>
    <button class="menu-toggle" aria-label="Menu" aria-expanded="false"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <nav class="nav" id="nav">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="gallery.html">Gallery</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
  </header>

  <main>
    <section class="section">
      <div class="contact-wrap">
        <div class="contact-photo"><img src="images/contact_painting.jpeg" alt="A painting by the artist"></div>
        <div>
          <h1 class="page-title">Say hello</h1>
          <p class="lead">Questions about a piece, a custom order, or just want to chat about flowers? Send me a note.</p>
          <!-- Replace YOUR_FORM_ID with your free Formspree form ID (formspree.io) -->
          <form class="form" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
            <label>Name <input name="name" required></label>
            <label>Email <input name="email" type="email" required></label>
            <label>Message <textarea name="message" rows="6" required></textarea></label>
            <button class="btn" type="submit">Send message</button>
          </form>
        </div>
      </div>
    </section>
  </main>

  <!-- FOOTER (same on every page). Change the Instagram link below. -->
  <footer class="site-footer">
    <a class="logo" href="index.html">Your Name</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="gallery.html">Gallery</a>
      <a href="contact.html">Contact</a>
      <a class="ig-link" href="https://instagram.com/yourhandle" target="_blank" rel="noopener" aria-label="Instagram"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".8" fill="currentColor"/></svg></a>
    </nav>
    <p class="fine">&copy; <span id="year"></span> Your Name. All art made by hand.</p>
  </footer>

  <script src="main.js"></script>
</body>
</html>
